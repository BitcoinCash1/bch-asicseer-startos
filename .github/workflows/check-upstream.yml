name: Check Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new upstream ASICSeer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags --refs https://github.com/cculianu/asicseer-pool.git 'v*' |
            sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT=$(sed -nE 's/^ARG ASICSEER_REF=(.*)$/\1/p' Dockerfile)
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $LATEST — no update"
            exit 0
          fi


          echo "Updating $CURRENT -> $LATEST"
          BEFORE=$(git rev-parse HEAD)
          bash scripts/auto-bump.sh "$LATEST"
          # GITHUB_TOKEN pushes do not start Tag and Release.
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then gh workflow run tagAndRelease.yml; fi
        shell: bash
